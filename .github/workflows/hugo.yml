name: Build and deploy Hugo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pull requests only build and check the site. Only the deploy job can publish.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: '0.153.4'
  TZ: UTC

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          set -euo pipefail
          HUGO_DIR="${RUNNER_TEMP}/hugo"
          mkdir -p "$HUGO_DIR"
          cd "$HUGO_DIR"
          RELEASE="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl -fsSLO "${RELEASE}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "${RELEASE}/hugo_${HUGO_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "hugo_${HUGO_VERSION}_checksums.txt"
          tar -xzf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "$HUGO_DIR" >> "$GITHUB_PATH"

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build and check
        env:
          # A subpath in PR builds catches links that fail on project Pages sites.
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url || 'https://example.org/site-check' }}
        run: |
          hugo --gc --minify --panicOnWarning \
            --baseURL "${SITE_BASE_URL}/" \
            --cacheDir "${RUNNER_TEMP}/hugo-cache"
          python3 scripts/check_site.py public --base-url "${SITE_BASE_URL}/"

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
